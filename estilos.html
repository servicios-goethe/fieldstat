<style>
  /* ═══════════════════════════════════════════
     FIELDSTATS — BRAND BOOK DESIGN SYSTEM
     Verde Energía · Azul Profundo · Dorado
  ═══════════════════════════════════════════ */

  :root {
    /* ── Brand Palette ── */
    --color-azul-profundo:  #0D1B2A;
    --color-azul-enfoque:   #1B365D;
    --color-verde-campo:    #2E7032;
    --color-verde-energia:  #4CAF50;
    --color-dorado:         #DAA837;
    --color-gris-neutro:    #6D7280;

    /* ── Semantic Tokens ── */
    --primary:        #4CAF50;
    --primary-hover:  #2E7032;
    --bg:             #0D1B2A;
    --surface:        rgba(14, 26, 40, 0.88);
    --surface-card:   rgba(18, 32, 50, 0.9);
    --text:           #EDF2F7;
    --text-muted:     #7A94AA;
    --success:        #4CAF50;
    --danger:         #EF4444;
    --border:         rgba(76, 175, 80, 0.14);
    --border-hover:   rgba(76, 175, 80, 0.65);
    --radius:         18px;
    --radius-sm:      10px;

    /* ── Neon Glows ── */
    --neon-verde:  0 0 10px rgba(76,175,80,0.55), 0 0 28px rgba(76,175,80,0.22);
    --neon-dorado: 0 0 10px rgba(218,168,55,0.55), 0 0 28px rgba(218,168,55,0.22);
    --shadow:      0 6px 28px rgba(0,0,0,0.45), 0 2px 8px rgba(0,0,0,0.3);
  }

  /* ── RESET ── */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Outfit', 'Inter', sans-serif;
  }

  /* ══════════════════════════════════
     DYNAMIC BACKGROUND
  ══════════════════════════════════ */
  body {
    background-color: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
  }

  /* Subtle grid overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(76,175,80,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(76,175,80,0.025) 1px, transparent 1px);
    background-size: 44px 44px;
    pointer-events: none;
    z-index: 0;
  }

  /* Floating ambient orbs */
  .bg-orb {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
    will-change: transform, opacity;
  }

  .bg-orb-1 {
    width: 700px; height: 700px;
    background: radial-gradient(circle at 40% 40%, rgba(76,175,80,0.13) 0%, transparent 65%);
    top: -250px; left: -200px;
    animation: orbFloat1 30s ease-in-out infinite;
  }

  .bg-orb-2 {
    width: 560px; height: 560px;
    background: radial-gradient(circle at 60% 60%, rgba(27,54,93,0.5) 0%, transparent 65%);
    bottom: -180px; right: -180px;
    animation: orbFloat2 38s ease-in-out infinite;
  }

  .bg-orb-3 {
    width: 420px; height: 420px;
    background: radial-gradient(circle at 50% 50%, rgba(218,168,55,0.09) 0%, transparent 65%);
    top: 45%; left: 45%;
    animation: orbFloat3 24s ease-in-out infinite;
  }

  @keyframes orbFloat1 {
    0%,100% { transform: translate(0,0) scale(1);      opacity: .8; }
    25%      { transform: translate(130px,90px) scale(1.15); opacity: 1; }
    50%      { transform: translate(70px,220px) scale(.9);  opacity: .6; }
    75%      { transform: translate(190px,130px) scale(1.1);opacity: .9; }
  }
  @keyframes orbFloat2 {
    0%,100% { transform: translate(0,0) scale(1);       opacity: .7; }
    30%      { transform: translate(-110px,-90px) scale(1.2); opacity: 1; }
    60%      { transform: translate(-55px,-175px) scale(.85); opacity: .5; }
    80%      { transform: translate(-150px,-70px) scale(1.05);opacity: .8; }
  }
  @keyframes orbFloat3 {
    0%,100% { transform: translate(-50%,-50%) scale(1);   opacity: .6; }
    40%      { transform: translate(-30%,-70%) scale(1.3); opacity: .9; }
    70%      { transform: translate(-70%,-30%) scale(.8);  opacity: .4; }
  }

  /* ══════════════════════════════════
     APP SHELL
  ══════════════════════════════════ */
  .app-container {
    width: 100%;
    max-width: 480px;
    position: relative;
    z-index: 1;
  }

  /* ── SCREENS ── */
  .screen {
    display: none;
    background: var(--surface);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    padding: 32px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.04);
    position: relative;
    overflow: hidden;
  }

  /* Top glow line */
  .screen::before {
    content: '';
    position: absolute;
    top: 0; left: 12%; right: 12%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(76,175,80,0.6), rgba(218,168,55,0.35), transparent);
  }

  .screen.active {
    display: block;
    animation: screenIn 0.38s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes screenIn {
    from { opacity: 0; transform: translateY(18px) scale(0.975); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ══════════════════════════════════
     TYPOGRAPHY
  ══════════════════════════════════ */
  h1, h2 {
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
    letter-spacing: -0.025em;
  }

  h1 {
    font-size: 30px;
    color: var(--color-verde-energia);
    text-shadow: 0 0 24px rgba(76, 175, 80, 0.45), 0 2px 8px rgba(0, 0, 0, 0.4);
    -webkit-text-fill-color: var(--color-verde-energia);
  }

  h2 { font-size: 24px; }

  .subtitle {
    color: var(--text-muted);
    font-size: 15px;
    margin-bottom: 32px;
  }

  /* ══════════════════════════════════
     INPUTS
  ══════════════════════════════════ */
  .input-group { margin-bottom: 20px; }

  .input-group label {
    display: block;
    font-size: 11.5px;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }

  input[type="text"],
  input[type="password"],
  input[type="number"],
  input[type="date"],
  input[type="time"] {
    width: 100%;
    padding: 12px 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(76,175,80,0.2);
    border-radius: var(--radius-sm);
    font-size: 15px;
    color: var(--text);
    outline: none;
    transition: border-color .25s, box-shadow .25s, background .25s;
    font-family: 'Outfit', sans-serif;
  }

  input::placeholder { color: rgba(122,148,170,0.45); }

  input:focus {
    border-color: var(--color-verde-energia);
    background: rgba(76,175,80,0.05);
    box-shadow: 0 0 0 3px rgba(76,175,80,0.15), var(--neon-verde);
  }

  /* ══════════════════════════════════
     BUTTONS
  ══════════════════════════════════ */
  .btn {
    width: 100%;
    padding: 14px;
    border-radius: var(--radius-sm);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all .28s cubic-bezier(0.34,1.56,0.64,1);
    font-family: 'Outfit', sans-serif;
    letter-spacing: 0.01em;
    position: relative;
    overflow: hidden;
  }

  .btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 55%);
    opacity: 0;
    transition: opacity .2s;
    border-radius: inherit;
  }
  .btn:hover::after { opacity: 1; }

  .btn-primary {
    background: linear-gradient(135deg, var(--color-verde-energia) 0%, var(--color-verde-campo) 100%);
    color: #fff;
    box-shadow: 0 4px 16px rgba(76,175,80,0.32);
  }
  .btn-primary:hover {
    transform: translateY(-3px) scale(1.01);
    box-shadow: var(--neon-verde), 0 8px 24px rgba(76,175,80,0.38);
  }
  .btn-primary:active { transform: translateY(0) scale(1); }

  .btn-outline {
    background: transparent;
    border: 1px solid rgba(76,175,80,0.28);
    color: var(--text);
  }
  .btn-outline:hover {
    background: rgba(76,175,80,0.08);
    border-color: var(--color-verde-energia);
    box-shadow: 0 0 0 1px rgba(76,175,80,0.28);
    transform: translateY(-1px);
  }

  /* ══════════════════════════════════
     NAV BAR
  ══════════════════════════════════ */
  .nav-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(76,175,80,0.1);
  }

  .nav-btn {
    background: none;
    border: none;
    color: var(--color-verde-energia);
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
    padding: 7px 14px;
    border-radius: 8px;
    transition: background .2s, box-shadow .2s, transform .2s;
    font-family: 'Outfit', sans-serif;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .nav-btn:hover {
    background: rgba(76,175,80,0.1);
    box-shadow: 0 0 10px rgba(76,175,80,0.2);
    transform: translateY(-1px);
  }

  /* ══════════════════════════════════
     ACTION CARDS
  ══════════════════════════════════ */
  .action-card {
    padding: 18px 20px;
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-bottom: 14px;
    cursor: pointer;
    transition: all .32s cubic-bezier(0.34,1.56,0.64,1);
    background: var(--surface-card);
    position: relative;
    overflow: hidden;
  }

  /* Inner gradient reveal on hover */
  .action-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(76,175,80,0.07) 0%, transparent 65%);
    opacity: 0;
    transition: opacity .3s ease;
    border-radius: inherit;
    pointer-events: none;
  }

  .action-card:hover {
    border-color: var(--color-verde-energia);
    box-shadow: var(--neon-verde), 0 10px 34px rgba(0,0,0,0.32);
    transform: translateY(-5px) scale(1.015);
  }
  .action-card:hover::before { opacity: 1; }

  .action-card h3 {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    letter-spacing: -0.01em;
  }

  /* ── Menu Icon Badge ── */
  .menu-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px; height: 38px;
    border-radius: 10px;
    background: rgba(76,175,80,0.14);
    color: var(--color-verde-energia);
    flex-shrink: 0;
    transition: background .3s, box-shadow .3s;
  }
  .action-card:hover .menu-icon {
    background: rgba(76,175,80,0.26);
    box-shadow: 0 0 12px rgba(76,175,80,0.38);
  }

  .menu-icon.gold {
    background: rgba(218,168,55,0.14);
    color: var(--color-dorado);
  }
  .action-card:hover .menu-icon.gold {
    background: rgba(218,168,55,0.26);
    box-shadow: 0 0 12px rgba(218,168,55,0.38);
  }

  /* Inline icon (for modal titles, warnings, etc.) */
  .inline-icon {
    vertical-align: middle;
    display: inline-block;
  }

  /* ══════════════════════════════════
     SELECTORS
  ══════════════════════════════════ */
  .selector {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid rgba(76,175,80,0.2);
    border-radius: var(--radius-sm);
    font-size: 15px;
    background: rgba(255,255,255,0.04);
    color: var(--text);
    margin-bottom: 16px;
    outline: none;
    transition: border-color .25s, box-shadow .25s;
    cursor: pointer;
    font-family: 'Outfit', sans-serif;
  }
  .selector:focus {
    border-color: var(--color-verde-energia);
    box-shadow: 0 0 0 3px rgba(76,175,80,0.15);
  }
  .selector option { background: #1a2d42; }

  /* ══════════════════════════════════
     PLAYER ROWS
  ══════════════════════════════════ */
  .player-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    border-bottom: 1px solid rgba(76,175,80,0.07);
    transition: background .2s;
    border-radius: 8px;
  }
  .player-row:last-child { border-bottom: none; }
  .player-row:hover { background: rgba(76,175,80,0.04); }

  /* ══════════════════════════════════
     TOGGLE SWITCH
  ══════════════════════════════════ */
  .toggle-switch { position: relative; width: 50px; height: 28px; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }

  .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.12);
    transition: .32s cubic-bezier(0.34,1.56,0.64,1);
    border-radius: 28px;
  }
  .slider::before {
    position: absolute;
    content: "";
    height: 20px; width: 20px;
    left: 4px; bottom: 3px;
    background: #fff;
    transition: .32s cubic-bezier(0.34,1.56,0.64,1);
    border-radius: 50%;
    box-shadow: 0 2px 8px rgba(0,0,0,0.35);
  }
  input:checked + .slider {
    background: var(--color-verde-energia);
    border-color: var(--color-verde-energia);
    box-shadow: 0 0 10px rgba(76,175,80,0.55);
  }
  input:checked + .slider::before { transform: translateX(22px); }

  /* ══════════════════════════════════
     TOGGLE TABS
  ══════════════════════════════════ */
  .toggle-group {
    display: flex;
    background: rgba(0,0,0,0.3);
    padding: 4px;
    border-radius: 12px;
    margin-bottom: 20px;
    border: 1px solid rgba(76,175,80,0.1);
    gap: 2px;
  }

  .toggle-option {
    flex: 1;
    text-align: center;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text-muted);
    transition: all .25s ease;
    font-weight: 500;
    font-family: 'Outfit', sans-serif;
  }
  .toggle-option.active {
    background: linear-gradient(135deg, var(--color-verde-energia), var(--color-verde-campo));
    color: #fff;
    box-shadow: 0 2px 12px rgba(76,175,80,0.45), var(--neon-verde);
  }
  .toggle-option:hover:not(.active) {
    background: rgba(76,175,80,0.08);
    color: var(--text);
  }

  /* ══════════════════════════════════
     LOADING OVERLAY
  ══════════════════════════════════ */
  #loading-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(13,27,42,0.92);
    backdrop-filter: blur(10px);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 14px;
    font-weight: 700;
    font-size: 17px;
    color: var(--color-verde-energia);
    letter-spacing: 0.06em;
    font-family: 'Outfit', sans-serif;
  }

  /* Spinner ring */
  #loading-overlay::after {
    content: '';
    width: 42px; height: 42px;
    border: 3px solid rgba(76,175,80,0.18);
    border-top-color: var(--color-verde-energia);
    border-radius: 50%;
    animation: spin .75s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ══════════════════════════════════
     MODAL
  ══════════════════════════════════ */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.72);
    backdrop-filter: blur(10px);
    z-index: 2000;
    justify-content: center;
    align-items: center;
  }

  .modal-content {
    background: rgba(14,26,42,0.97);
    border: 1px solid rgba(76,175,80,0.32);
    padding: 28px;
    border-radius: 18px;
    width: 90%;
    max-width: 400px;
    box-shadow: var(--neon-verde), var(--shadow);
    animation: screenIn .3s ease;
    position: relative;
    overflow: hidden;
  }
  .modal-content::before {
    content: '';
    position: absolute;
    top: 0; left: 10%; right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(76,175,80,0.7), transparent);
  }

  .modal-content h3 {
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    margin-bottom: 20px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
  }

  /* ══════════════════════════════════
     STAT CARDS (PREMIUM)
  ══════════════════════════════════ */
  .stats-grid-2col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }

  .stat-card-premium {
    background: rgba(18,32,50,0.9);
    border: 1px solid rgba(76,175,80,0.1);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
    transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .stat-card-premium:hover {
    transform: translateY(-3px);
    border-color: var(--color-verde-energia);
    box-shadow: var(--neon-verde);
  }

  .stat-icon-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px; height: 38px;
    border-radius: 10px;
    flex-shrink: 0;
  }
  .stat-icon-wrapper.blue   { background: rgba(27,54,93,0.45);   color: #64b5f6; }
  .stat-icon-wrapper.orange { background: rgba(218,168,55,0.14); color: var(--color-dorado); }
  .stat-icon-wrapper.green  { background: rgba(76,175,80,0.14);  color: var(--color-verde-energia); }
  .stat-icon-wrapper.purple { background: rgba(168,85,247,0.14); color: #a855f7; }
  .stat-icon-wrapper.yellow { background: rgba(218,168,55,0.14); color: var(--color-dorado); }

  .stat-card-value {
    font-size: 32px;
    font-weight: 700;
    color: #fff;
    line-height: 1;
    margin-top: 4px;
    font-family: 'Outfit', sans-serif;
  }

  .progress-blocks-container { display: flex; gap: 4px; width: 100%; }

  .progress-block {
    flex: 1; height: 8px;
    border-radius: 4px;
    background: rgba(76,175,80,0.1);
    transition: background .3s;
  }
  .progress-block.active {
    background: linear-gradient(90deg, var(--color-verde-energia), var(--color-verde-campo));
    box-shadow: 0 0 7px rgba(76,175,80,0.55);
  }

  .stats-footer-info {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 16px;
    justify-content: center;
  }

  /* ══════════════════════════════════
     SCROLLBAR
  ══════════════════════════════════ */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
  ::-webkit-scrollbar-thumb { background: rgba(76,175,80,0.3); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(76,175,80,0.55); }
</style>
